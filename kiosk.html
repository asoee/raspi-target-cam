<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Stream - Kiosk Mode</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #videoStream {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
      }

      /* Hide cursor after inactivity */
      body.hide-cursor {
        cursor: none;
      }

      /* Press F11 hint - fades out after 5 seconds */
      #fullscreenHint {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        opacity: 1;
        transition: opacity 1s;
        z-index: 1000;
      }

      #fullscreenHint.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img
      id="videoStream"
      src="/stream.mjpg"
      alt="Camera Stream"
    />

    <div id="fullscreenHint">Press F11 for fullscreen</div>

    <script>
      let cursorTimeout;

      // Hide cursor after 3 seconds of inactivity
      function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimeout);
        cursorTimeout = setTimeout(() => {
          document.body.classList.add('hide-cursor');
        }, 3000);
      }

      // Track mouse movement
      document.addEventListener('mousemove', resetCursorTimer);

      // Initial cursor hide
      resetCursorTimer();

      // Hide fullscreen hint after 5 seconds
      setTimeout(() => {
        document.getElementById('fullscreenHint').classList.add('hidden');
      }, 5000);

      // Press Escape to exit (show hint again)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const hint = document.getElementById('fullscreenHint');
          hint.classList.remove('hidden');
          setTimeout(() => {
            hint.classList.add('hidden');
          }, 5000);
        }
      });

      // Handle stream errors
      document.getElementById('videoStream').addEventListener('error', () => {
        console.error('Stream error - retrying in 2 seconds...');
        setTimeout(() => {
          document.getElementById('videoStream').src = '/stream.mjpg?' + new Date().getTime();
        }, 2000);
      });
    </script>
  </body>
</html>
